services:
  guardpost:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - guardpost_data:/data
    environment:
      - GUARDPOST_REDIS_URL=redis://redis:6379
      - GUARDPOST_API_KEY=${GUARDPOST_API_KEY:-}
      - GUARDPOST_RATE_LIMIT=${GUARDPOST_RATE_LIMIT:-0}
      # Without any API key Guardpost refuses to start unless this is 1 (dev only).
      - GUARDPOST_ALLOW_OPEN=${GUARDPOST_ALLOW_OPEN:-}
      # Redis is the storage here (single tenant). For tenants, set
      # GUARDPOST_STORAGE=sqlite: Redis then serves rate limiting only.
      - GUARDPOST_STORAGE=${GUARDPOST_STORAGE:-}
      - GUARDPOST_SECRET=${GUARDPOST_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  guardpost_data:
  redis_data:
