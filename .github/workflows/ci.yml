name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dispatched by update-blocklist.yml on auto/update-blocklist, because a PR
  # opened with GITHUB_TOKEN does not trigger this workflow on its own.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check guardpost/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Never publish from a manual dispatch, even one run against main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          pip install --quiet "setuptools-scm>=8"
          echo "version=$(python -c 'import setuptools_scm; print(setuptools_scm.get_version(fallback_version="0.0.0.dev0"))')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Main builds are "edge": deployments pin a release tag (:0.2), so a merge
          # never changes what production runs. :latest moves only on a release.
          build-args: |
            GUARDPOST_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/superposition-labs/guardpost:edge
            ghcr.io/superposition-labs/guardpost:${{ github.sha }}
